services:
  bot:
    build: .
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - bot_data:/app/data
    # Only reachable by the caddy service in webhook mode.
    expose:
      - "8443"

  # Optional TLS reverse proxy for MODE=webhook.
  # Start with: docker compose --profile webhook up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["webhook"]
    restart: unless-stopped
    depends_on:
      - bot
    environment:
      WEBHOOK_DOMAIN: ${WEBHOOK_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  bot_data:
  caddy_data:
  caddy_config:
